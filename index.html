<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sümeyye'nin Aşk Bahçesi ❤️</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#211c32;color:#fff;
 font-family:monospace;text-align:center;
}
h1{color:#ffb7d6;font-size:23px;margin:20px 5px 5px}
.sub{color:#f6d7e6;font-size:12px;margin:10px}
.game-wrap{width:96%;max-width:760px;margin:auto}
canvas{
 width:100%;display:block;
 border:5px solid #f1b0ce;border-radius:12px;
 image-rendering:pixelated;
 box-shadow:0 5px 25px #0007;
}
.hint{font-size:12px;color:#f5cce0;margin:12px}
#message{
 display:none;background:#fff0f6;color:#613a53;
 border:3px solid #efa8c8;border-radius:14px;
 padding:18px;margin:12px auto;max-width:550px;
 width:94%;font-size:14px;line-height:1.7;
}
#message button{
 display:block;margin:12px auto 0;padding:8px 20px;
}
.controls{
 display:grid;grid-template-columns:65px 65px 65px;
 gap:6px;justify-content:center;margin:14px auto;
}
button{
 background:#e99abb;color:#542c43;
 border:2px solid #ffd5e6;border-radius:12px;
 padding:11px;font-family:monospace;
 font-size:20px;touch-action:none;
}
button:active{background:#ffd2e5}
#action{font-size:14px;padding:12px 22px}
footer{font-size:11px;color:#e8bdd1;margin:20px}
</style>
</head>
<body>

<h1>🌸 Sümeyye'nin Aşk Bahçesi 🌸</h1>
<div class="sub">Küçük bir dünya, kocaman bir sevgi ❤️</div>

<div class="game-wrap">
<canvas id="game" width="480" height="360"></canvas>
</div>

<div class="hint">Gezmek için yön tuşlarını kullan. Bir sürprize yaklaşınca E'ye bas.</div>

<div id="message">
 <div id="messageText"></div>
 <button onclick="closeMessage()">Kapat 💗</button>
</div>

<div class="controls">
 <span></span><button data-dir="up">▲</button><span></span>
 <button data-dir="left">◀️</button>
 <button data-dir="down">▼</button>
 <button data-dir="right">▶️</button>
</div>

<button id="action">💌 Yakındaki sürprizi aç</button>
<footer>Bu bahçenin en güzel çiçeği sensin. ❤️</footer>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
const W=480,H=360;
const player={x:240,y:190,step:0};
const keys={};
let lastMessage=null;

const objects=[
 {x:95,y:115,emoji:"🌷",name:"Sana bir çiçek",
  text:"Her çiçek bir gün solar belki... Ama sana olan sevgim hiç solmayacak. 🌷"},
 {x:390,y:110,emoji:"💗",name:"Kalbimden sana",
  text:"Kalbimin en güzel köşesinde hep sen varsın. İyi ki hayatımdasın. ❤️"},
 {x:390,y:285,emoji:"🎁",name:"Sürpriz kutusu",
  text:"Bu kutunun içinde bir sır var: Benim en büyük şansım seninle tanışmış olmak. Seni çok seviyorum! 💌"},
 {x:90,y:285,emoji:"✨",name:"Dilek göleti",
  text:"Bir dileğim var: Bütün güzel günlerimizi birlikte yaşamak. 🌙"}
];

function rect(x,y,w,h,c){
 ctx.fillStyle=c;
 ctx.fillRect(Math.round(x),Math.round(y),w,h);
}

function tree(x,y){
 rect(x-5,y,11,25,"#795037");
 rect(x-19,y-15,39,31,"#34794a");
 rect(x-12,y-24,25,20,"#529b5b");
 rect(x-12,y-11,8,7,"#80c36d");
}

function flower(x,y,color="#ffadd0"){
 rect(x-2,y,4,10,"#387b42");
 rect(x-8,y-7,7,7,color);
 rect(x+2,y-7,7,7,color);
 rect(x-3,y-13,7,7,"#ffe59c");
 rect(x-2,y-3,7,7,"#ff80b3");
}

function drawHouse(){
 // ev gövdesi
 rect(25,20,115,70,"#f4d7bc");
 rect(18,17,129,17,"#a95872");
 rect(28,12,109,7,"#cf7b8d");
 // kapı ve pencereler
 rect(69,49,28,41,"#82526b");
 rect(36,40,23,20,"#a8e0e4");
 rect(106,40,23,20,"#a8e0e4");
 rect(48,47,2,5,"#fff");
 rect(117,47,2,5,"#fff");
}

function drawGarden(){
 rect(0,0,W,H,"#70b777");

 // Çimen dokusu
 for(let y=8;y<H;y+=28){
  for(let x=8;x<W;x+=28){
   rect(x,y,3,3,"#8ac986");
   rect(x+13,y+12,3,3,"#579c68");
  }
 }
