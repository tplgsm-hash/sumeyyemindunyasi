<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sümeyye'nin Dünyası ❤️</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#241d35;color:white;
 text-align:center;font-family:monospace;
}
h1{color:#ffb4d5;margin:20px 5px 5px}
.sub{color:#ffe0ed;margin:12px}
canvas{
 width:94%;max-width:700px;
 border:5px solid #f3a9ca;
 border-radius:10px;
 image-rendering:pixelated;
 background:#70b879;
}
.info{font-size:13px;color:#ffd8e9;margin:12px}
#message{
 display:none;background:#fff0f6;color:#713d5c;
 border:3px solid #efa8c8;border-radius:12px;
 padding:18px;margin:12px auto;width:90%;
 max-width:500px;line-height:1.7;font-size:15px;
}
.controls{
 display:grid;
 grid-template-columns:65px 65px 65px;
 gap:6px;justify-content:center;margin:15px;
}
button{
 border:2px solid #ffd4e7;
 background:#e995bc;color:#522c43;
 border-radius:12px;padding:12px;
 font-size:22px;touch-action:none;
}
#action{font-size:15px;padding:12px 25px}
footer{color:#e9b9d2;margin:22px;font-size:12px}
</style>
</head>
<body>

<h1>🌸 Sümeyye'nin Minik Dünyası 🌸</h1>
<div class="sub">Sana özel, sevgi dolu küçük bir dünya ❤️</div>

<canvas id="game" width="480" height="360"></canvas>

<div class="info">
Yön tuşlarıyla hareket et. Nesnelere yaklaş ve E'ye bas.
</div>

<div id="message"></div>

<div class="controls">
 <span></span><button data-dir="up">▲</button><span></span>
 <button data-dir="left">◀️</button>
 <button data-dir="down">▼</button>
 <button data-dir="right">▶️</button>
</div>

<button id="action">💗 Sürprizi keşfet</button>

<footer>Sen benim en güzel hikâyemsin ❤️</footer>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

const player={x:240,y:180};
const keys={};

const objects=[
 {x:90,y:110,emoji:"🌷",name:"Çiçek",
 text:"Senin gülüşün bütün çiçeklerden daha güzel. 🌷"},
 {x:380,y:110,emoji:"💗",name:"Kalp",
 text:"İyi ki yollarımız kesişmiş. İyi ki sen. ❤️"},
 {x:380,y:280,emoji:"🎁",name:"Sürpriz Sandığı",
 text:"Bu küçük dünyanın en güzel hediyesi sensin. Seni çok seviyorum! 💌"},
 {x:90,y:280,emoji:"✨",name:"Dilek Göleti",
 text:"Bir dilek tuttum: Bütün güzel yarınlarımda sen ol. ❤️"}
];

function rect(x,y,w,h,color){
 ctx.fillStyle=color;
 ctx.fillRect(x,y,w,h);
}

function tree(x,y){
 rect(x-5,y,10,23,"#795037");
 rect(x-18,y-15,36,30,"#347b48");
 rect(x-12,y-24,25,20,"#529b5b");
 rect(x-10,y-12,8,7,"#85c96d");
}

function flower(x,y){
 rect(x-2,y,4,10,"#347d42");
 rect(x-8,y-7,7,7,"#ffadd0");
 rect(x+2,y-7,7,7,"#ffadd0");
 rect(x-3,y-13,7,7,"#ffe69b");
 rect(x-2,y-3,7,7,"#ff80b4");
}

function draw(){
 // Çimen
 rect(0,0,480,360,"#72b879");

 for(let y=10;y<360;y+=28){
  for(let x=10;x<480;x+=28){
   rect(x,y,3,3,"#8bc987");
   rect(x+12,y+10,3,3,"#579d68");
  }
 }

 // Yol
 rect(180,0,120,360,"#c9a77b");
 rect(0,150,480,60,"#c9a77b");

 for(let y=0;y<360;y+=30){
  rect(180,y,3,18,"#b18c67");
  rect(296,y,3,18,"#b18c67");
 }

 // Ev
 rect(25,20,115,70,"#f4d7bc");
 rect(18,17,129,17,"#b95e78");
 rect(70,49,27,41,"#87546d");
 rect(36,40,23,20,"#a9dfe1");
 rect(106,40,23,20,"#a9dfe1");

 // Ağaçlar
 tree(170,65);
 tree(320,65);
 tree(45,135);
 tree(435,135);
 tree(160,310);
 tree(325,310);

 // Çiçekler
 [[155,110],[320,115],[155,245],
 [320,245],[35,220],[445,220],
 [220,30],[270,325]].forEach(p=>flower(p[0],p[1]));

 // Gölet
 rect(45,280,55,30,"#70bce0");
 rect(51,285,42,20,"#a2e3e8");
 rect(62,291,13,3,"#e1ffff");

 // Etkileşim nesneleri
 objects.forEach(o=>{
  ctx.font="25px serif";
  ctx.textAlign="center";
  ctx.fillText(o.emoji,o.x,o.y);
 });

 // Avatar gölgesi
 rect(player.x-8,player.y+12,16,4,"#477c4d");

 // Saç
 rect(player.x-9,player.y-13,18,14,"#583449");
 rect(player.x-11,player.y-7,4,12,"#583449");

 // Yüz
 rect(player.x-7,player.y-9,…
